name: Verify Molecule
on:
  pull_request:
  push:
    branches: [main, Backboard]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: timescale/timescaledb:2.22.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molecule
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.17
      - run: pnpm bootstrap
      - run: pnpm format && pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build && pnpm solver:lint && pnpm solver:test
      - run: pnpm verify:secrets && pnpm verify:desktop && pnpm verify:kit
      - name: Database adapters
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/molecule
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/molecule
          SHOPIFY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/molecule
        run: |
          pnpm --filter @molecule/db test
          pnpm --filter @molecule/events test
          pnpm --filter @molecule/service-reality test
          pnpm --filter @molecule/merchant-agents test
          pnpm --filter @molecule/shopify test
      - name: Durable orchestration acceptance
        env:
          PGPASSWORD: postgres
          ORCHESTRATOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/molecule_runtime_test
        run: |
          createdb -h 127.0.0.1 -U postgres molecule_runtime_test
          pnpm verify:durable
