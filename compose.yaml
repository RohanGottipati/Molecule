services:
  db:
    image: timescale/timescaledb:2.22.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: molecule
    ports:
      - "127.0.0.1:${MOLECULE_DB_PORT:-5432}:5432"
    volumes:
      - molecule-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d molecule"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  molecule-data:
